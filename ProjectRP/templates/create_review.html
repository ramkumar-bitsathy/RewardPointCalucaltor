<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'create_review.css' %}">
    <title>Document</title>
</head>
<body>

    <h1> UNDER DEVELOPMENT </h1>


    <div class="top-bar">
        <img src="{% static 'logo.png' %}">
        <marquee scrollamount=30 class="reviewer-marque">Create Review - Reward point calculation portal - Technical Approval Committee</marquee>
    </div>
    <hr>

    <div class="create-review-div">
        <div class="form">
            <form method="post">
                <h2>Create review for PID</h2>
                <Label for="pid-input">PID:</Label>
                <input type="text" class="pid-input" name="pid-input" id="pid-inp">
                <input type="submit" class="enter" name="enter">
                {% if pid %}
                <script>
                    document.addEventListener("DOMContentLoaded", function() {
                        document.getElementById('pid-inp').value = "{{ pid }}";
                    });
                </script>
                {% endif %}
                {% if pid_details %}
                    <select name="student-selector" class="student-selector">
                        {% for detail in pid_details %}
                        <option value='{{ detail.Student_Name }}' >{{ detail.Student_Name }}</option>
                        {% endfor %}
                    </select>
                    Rollno: <h4>{{detail.Student_RollNo}}</h4>
                    Project: <h4>{{detail.Project_Name}}</h4>
                {% endif %}

                <input type="submit" class="enter" name="enter">
            </form>
        </div>
    </div>
</body>
</html>
